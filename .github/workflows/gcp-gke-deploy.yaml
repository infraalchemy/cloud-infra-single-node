name: Deploy Moodle to GKE

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: civic-champion-439320-a5
  REGION: northamerica-northeast2
  CLUSTER_NAME: moodle-gke-cluster
  CLUSTER_LOCATION: northamerica-northeast2-a
  IMAGE: northamerica-northeast2-docker.pkg.dev/civic-champion-439320-a5/moodle-repo/custom-php:8.2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1006034492977/locations/global/workloadIdentityPools/github/providers/cloud-infra-single-node
          service_account: github-actions@civic-champion-439320-a5.iam.gserviceaccount.com
          project_id: civic-champion-439320-a5
    
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: civic-champion-439320-a5

      - name: Verify Google Cloud authentication
        run: |
          gcloud auth list
          gcloud config get-value project

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker \
            northamerica-northeast2-docker.pkg.dev \
            --quiet

      - name: Build PHP image
        run: |
          docker build \
            -t "$IMAGE" \
            docker/php

      - name: Push PHP image
        run: |
          docker push "$IMAGE"

      - name: Verify PHP image
        run: |
          gcloud artifacts docker images describe "$IMAGE" 

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: moodle-gke-cluster
          location: northamerica-northeast2-a
          project_id: civic-champion-439320-a5

      - name: Verify GKE connection
        run: |
          kubectl cluster-info
          kubectl get nodes
      
      - name: Deploy Moodle to GKE
        run: |
          bash scripts/deploy-gke.sh

      - name: Verify Moodle deployment
        run: |
          kubectl get pods
          kubectl get pvc
          kubectl get ingress moodle-ingress


