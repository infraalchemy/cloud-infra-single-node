name: GCP Authentication Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-gcp-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1006034492977/locations/global/workloadIdentityPools/github/providers/cloud-infra-single-node
          service_account: github-actions@civic-champion-439320-a5.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify authentication
        run: |
          gcloud auth list
          gcloud config set project civic-champion-439320-a5
          gcloud config get-value project
