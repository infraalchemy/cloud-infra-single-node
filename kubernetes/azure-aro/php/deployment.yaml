# php deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  selector:
    matchLabels:
      app: php
  template:
    metadata:
      labels:
        app: php
    spec:
      serviceAccountName: moodle-aro-sa
      initContainers:
        - name: init-moodle
          image: moodlearoregistry.azurecr.io/moodle-init:8.2
          command:
            - sh
            - -c
            - |
              set -e

              cd /var/www/html

              if [ ! -f index.php ]; then
                echo "Moodle files not found. Downloading Moodle..."

                wget --max-redirect=5 -O /tmp/moodle.tgz "https://download.moodle.org/download.php/direct/stable404/moodle-latest-404.tgz"

                echo "Moodle download complete."

                echo "Extracting Moodle directly to Azure Files..."
                tar -xzf /tmp/moodle.tgz -C /var/www/html --strip-components=1

                echo "Moodle application files extracted."

                echo "Cleaning up temporary archive..."
                rm -f /tmp/moodle.tgz

                echo "Moodle installation files cleaned up."
              else
                echo "Existing Moodle application files found. Skipping download and extraction."
              fi

              echo "Moodle init container completed successfully."
              
          volumeMounts:
            - name: moodle-code
              mountPath: /var/www/html
            - name: moodle-data
              mountPath: /moodledata
      containers:
      - name: php
        image: moodlearoregistry.azurecr.io/custom-php:8.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
        env:
        - name: DB_HOST
          value: mysql
        - name: DB_NAME
          value: moodle
        - name: DB_USER
          value: moodleuser
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: php-secret
              key: db-password
        volumeMounts:
        - name: moodle-code
          mountPath: /var/www/html
        - name: moodle-data
          mountPath: /moodledata
      volumes:
      - name: moodle-code
        persistentVolumeClaim:
          claimName: moodle-pvc
      - name: moodle-data
        persistentVolumeClaim:
          claimName: moodledata-pvc
